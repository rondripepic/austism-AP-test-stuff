<!DOCTYPE html>
<html>
<head>
  <title>AP Classes Hub</title>

  <style>
    body {
      font-family: Arial;
      background-color: #121212;
      color: white;
      text-align: center;
      margin: 0;
      padding: 20px;
    }

    h1 {
      margin-bottom: 20px;
    }

    /* Layout container */
    .button-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 20px;
    }

    /* Base AP button style */
    .ap-button {
      background: linear-gradient(135deg, #2193b0, #6dd5ed);
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
      transition: 0.25s;
    }

    /* Hover effect */
    .ap-button:hover {
      transform: scale(1.08);
      box-shadow: 0 0 15px rgba(33, 147, 176, 0.6);
    }
  </style>
</head>

<body>

  <h1>AP Classes Hub</h1>

  <div class="button-container">
      <a href="Aps Classes Types/HistoryAps.html">
    <button class="ap-button">History Classes</button>
    </a>
    <a href="Aps Classes Types/EnglishAps.html">
      <button class="ap-button">English Classes</button>
    </a>
    <a href="Aps Classes Types/ScienceAps.html">
      <button class="ap-button">Science Classes</button>
    </a>
    <a href="Aps Classes Types/LanguageAps.html">
      <button class="ap-button">Language Classes</button>
    </a>
    <a href="Aps Classes Types/Arts.html">
      <button class="ap-button">Art Classes</button>
    </a>
    <a href="Aps Classes Types/MathAps.html">
      <button class="ap-button">Math Classes</button>
    </a>
    <a href="rankings.html">
    <button class="ap-button">Rankings</button>
    </a>
  </div>

</body>
</html>
