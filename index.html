<!DOCTYPE html>
<html>
<head>

  <title>My Website</title>

  <!-- 👇 PUT THE CSS HERE -->
  <style>
    body {
      font-family: Arial;
      background-color: #121212;

    button {
      padding: 10px 20px;

      background-color: #4CAF50;

  transition: 0.2s;

  .custom-button:hover {
    background-color: #3e8e41;
    transform: scale(1.05);
  }
  </style>

</head>
