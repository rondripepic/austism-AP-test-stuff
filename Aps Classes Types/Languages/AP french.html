<!DOCTYPE html>
<html>
<head>
  <title>AP Calculus Score Distribution</title>

  <style>
    body {
      font-family: Arial;
      background-color: #121212;
      color: white;
      text-align: center;
      padding: 20px;
    }

    table {
      margin: 20px auto;
      width: 80%;
      border-collapse: collapse;
      background-color: #1e1e1e;
    }

    th, td {
      border: 1px solid #333;
      padding: 12px;
      text-align: center;
    }

    th {
      background-color: #333;
    }

    tr:hover {
      background-color: #2a2a2a;
    }

    .back {
      margin-top: 20px;
      padding: 10px 20px;
      border: none;
      background: #4CAF50;
      color: white;
      cursor: pointer;
      border-radius: 8px;
    }

    .back:hover {
      background: #3e8e41;
    }
  </style>
</head>

<body>

  <h1>AP Calculus AB Score Distribution</h1>

  <table>
    <tr>
      <th>Score</th>
      <th>Percent</th>
    </tr>
    <tr><td>5</td><td>21%</td></tr>
    <tr><td>4</td><td>27%</td></tr>
    <tr><td>3</td><td>15%</td></tr>
    <tr><td>2</td><td>23%</td></tr>
    <tr><td>1</td><td>14%</td></tr>
  </table>

  <button class="back" onclick="onclick=history.back()">
    ⬅ Back
  </button>

</body>
</html>
